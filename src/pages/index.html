<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Print Pages</title>

    <link rel="stylesheet" href="/styles/common.css">
    <link rel="stylesheet" href="/styles/print-light.css">
    <script defer src="/scripts/pages-index.js"></script>
    <style>
        .header {
            padding: 6px 12px;
        }
        body {
            font-family: 'Alegreya';
        }
        ul {
            display: flex;
        }
        .item {
            font-size: 16px;
            overflow: hidden;
            font-weight: 500;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .category-heading {
            color: #000;
            margin-top: 24px;
            font-size: 24px;
            font-weight: 700;
        }
        .class-heading {
            margin-top: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
        }
        .type-heading {
            color: #000;
            margin-top: 10px;
            font-size: 15px;
            font-weight: 600;
            opacity: 0.75;
        }

        .pages-list {
            background-color: var(--fandom-primary-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px 12px
        }

        img {
            height: 40px;
            width: 40px;
            border: 1px ridge #010101;
            background-color: #0101012f;
        }

        .class-groups {
            display: flex;
        }

        .class-group, .type-group {
            display: flex;
            gap:3px;
            flex-direction: column;
        }

        .class-group {
            flex: 1;
        }
    </style>
</head>
<body style="background: #1e0c1b">
<main class="container">
    <div class="header">
        <h1 style="margin:0;">Сторінки для друку</h1>
    </div>

    <div id="pages-list" class="pages-list">
        <!-- автоматично -->
    </div>

</main>
</body>
</html>
