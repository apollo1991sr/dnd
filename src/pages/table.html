    <link rel="stylesheet" href="/styles/common.css">
    <link rel="stylesheet" href="/styles/print-light.css">
    <style>
        li {
            margin-left: 80px;
            font-family: 'Alegreya';
            font-size: 16px;
            overflow: hidden;
            font-weight: 500;
            line-height: 1.2;
        }

        .category-heading {
            color: #000;
            margin-left: 20px;
            margin-top: 24px;
            font-size: 24px;
            font-weight: 700;
        }

        .class-heading {
            margin-top: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            margin-left: 40px;
        }

        .type-heading {
            color: #000;
            margin-left: 60px;
            margin-top: 10px;
            font-size: 15px;
            font-weight: 600;
            opacity: 0.75;
        }

        .pages-list {

        }

        .table-row {
            display: flex;
            flex-direction: column;
        }

        .table-block {
            width: max-content;
        }

        .card-heading {
            display: flex;
            align-items: center;
            gap: 5px;
            border-bottom: 1px outset #ca884c !important;
            padding-bottom: 5px;
        }
        .card-body {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .common img {
            display: block;
        }
    </style>
</head>
